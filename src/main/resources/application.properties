server.port=${PORT:8081}

# --- SQLite via JPA/Hibernate ---
spring.datasource.url=jdbc:sqlite:tasks.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection avoids "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Auth (override via environment in real deployments) ---
app.auth.username=${APP_USERNAME:admin}
app.auth.password=${APP_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Swagger UI at /swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html

server.forward-headers-strategy=framework

server.forward-headers-strategy=framework
